[package]
name = "cadastru"
version = "1.10.0"
edition = "2024"
description = "Cadastru - aplicație GIS desktop: vizualizare hărți, conversie formate, reproiecție"
license = "MIT"
authors = ["Ginu Popescu <scriemiaici@proton.me>"]

[workspace]
members = [".", "i18n-macros"]

[lib]
name = "cadastru"
path = "src/lib.rs"

[[bin]]
name = "cadastru"
path = "src/main.rs"

[[bin]]
name = "cadastru-cli"
path = "src/bin/cli.rs"

[dependencies]
cadastru-i18n-macros = { path = "i18n-macros" }
ab_glyph = "0.2.32"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crs-definitions = "0.6.0"
csv = "1.4.0"
earcutr = "0.5.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11"] }
egui_extras = "0.37.0"
encoding_rs = "0.8.42"
epaint_default_fonts = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
proj4rs = "0.3.0"
proj4wkt = "0.2.0"
rfd = "0.17.2"
roxmltree = "0.21"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tiff = "0.11.3"
tiny-skia = "0.11.4"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3.0.12"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
winreg = "0.56.0"
